# Configuration de logging pour l'application Gestion Scolaire
# Utilise les Java Logging Utilities (java.util.logging)

# Handler par defaut
handlers=java.util.logging.ConsoleHandler

# Niveau de log global
.level=INFO

# Configuration du ConsoleHandler
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.ConsoleHandler.encoding=UTF-8

# Format des messages
java.util.logging.SimpleFormatter.format=%1$tF %1$tT %4$s %2$s %5$s%6$s%n

# Niveaux pour les packages specifiques
dao.level=INFO
controllers.level=INFO
services.level=INFO
application.level=INFO
